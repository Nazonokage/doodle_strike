name: doodle_strike
description: Doodle Strike - 2D Mini Militia-style multiplayer shooter built with Flutter & Flame.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  sim:
    path: packages/sim
  protocol:
    path: packages/protocol

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/maps/
    - assets/data/weapons.json
